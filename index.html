<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Digital - Descargas Instantáneas</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome para Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .gradient-bg {
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
        }
        .card-hover {
            transition: all 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        /* Animación de carga */
        .loader {
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 3px solid #3498db;
            width: 20px;
            height: 20px;
            -webkit-animation: spin 1s linear infinite; /* Safari */
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="gradient-bg min-h-screen flex flex-col text-gray-800">

    <!-- Navbar -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center">
                    <i class="fa-solid fa-cloud-arrow-down text-blue-600 text-2xl mr-2"></i>
                    <span class="font-bold text-xl tracking-tight">DigiStore</span>
                </div>
                <div class="flex items-center space-x-4">
                    <div class="hidden md:flex items-center text-sm text-gray-500 mr-4">
                        <i class="fa-brands fa-paypal mr-1 text-blue-800"></i> Pagos seguros
                    </div>
                    <button class="text-gray-500 hover:text-blue-600 transition">
                        <i class="fa-solid fa-shopping-cart text-xl"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Header / Hero -->
    <div class="bg-blue-600 text-white py-12">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <h1 class="text-3xl md:text-4xl font-bold mb-2">Archivos Digitales Premium</h1>
            <p class="text-blue-100">Compra, reclama y descarga al instante.</p>
        </div>
    </div>

    <!-- Contenido Principal -->
    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full">
        
        <!-- Filtros / Categorías (Visual) -->
        <div class="flex justify-center space-x-4 mb-8">
            <button class="px-4 py-2 bg-blue-600 text-white rounded-full text-sm font-semibold shadow-md">Todo</button>
            <button class="px-4 py-2 bg-white text-gray-600 rounded-full text-sm font-semibold hover:bg-gray-100 shadow-sm transition">Música</button>
            <button class="px-4 py-2 bg-white text-gray-600 rounded-full text-sm font-semibold hover:bg-gray-100 shadow-sm transition">E-books</button>
        </div>

        <!-- Grid de Productos -->
        <div id="product-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Los productos se inyectan aquí con JS -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 text-white py-8 mt-auto">
        <div class="max-w-7xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center">
            <div class="mb-4 md:mb-0">
                <span class="font-bold text-lg">DigiStore</span>
                <p class="text-gray-400 text-sm">© 2024 Todos los derechos reservados.</p>
            </div>
            <div class="flex space-x-4 text-2xl text-gray-400">
                <i class="fa-brands fa-cc-paypal hover:text-white transition cursor-pointer"></i>
                <i class="fa-brands fa-cc-visa hover:text-white transition cursor-pointer"></i>
                <i class="fa-brands fa-cc-mastercard hover:text-white transition cursor-pointer"></i>
            </div>
        </div>
    </footer>

    <!-- Modal de "Procesando" -->
    <div id="processing-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center backdrop-blur-sm">
        <div class="bg-white rounded-xl p-8 max-w-sm w-full text-center shadow-2xl transform transition-all scale-100">
            <div class="mb-4 flex justify-center">
                <div class="loader"></div>
            </div>
            <h3 class="text-xl font-bold text-gray-900 mb-2">Procesando Pedido...</h3>
            <p class="text-gray-500 text-sm">Verificando disponibilidad y preparando tu descarga.</p>
        </div>
    </div>

    <!-- Modal de Éxito -->
    <div id="success-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center backdrop-blur-sm">
        <div class="bg-white rounded-xl p-8 max-w-sm w-full text-center shadow-2xl">
            <div class="mb-4 flex justify-center text-green-500 text-5xl">
                <i class="fa-regular fa-circle-check"></i>
            </div>
            <h3 class="text-xl font-bold text-gray-900 mb-2">¡Compra Exitosa!</h3>
            <p class="text-gray-500 text-sm mb-6">Tu archivo se está descargando automáticamente.</p>
            <button onclick="closeModal('success-modal')" class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition">
                Cerrar
            </button>
        </div>
    </div>

    <!-- Script Lógica -->
    <script>
        // Base de datos de productos (Simulada)
        const products = [
            {
                id: 1,
                title: "L'amore dice ciao (Slow Take)",
                artist: "Compositor Desconocido", // Ajustar según corresponda
                type: "MP3 Audio",
                price: 0, // 0 significa Gratis
                coverColor: "bg-indigo-500",
                icon: "fa-music",
                url: "https://res.cloudinary.com/dsfthqppb/video/upload/v1755306251/L_amore_dice_ciao_Slow_Take_c1tiyn.mp3"
            }
        ];

        // Función para renderizar productos
        function renderProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';

            products.forEach(product => {
                const isFree = product.price === 0;
                const priceDisplay = isFree 
                    ? `<span class="text-green-600 font-bold">GRATIS</span> <span class="text-gray-400 text-xs line-through ml-1">$1.99</span>` 
                    : `<span class="text-gray-900 font-bold">$${product.price.toFixed(2)}</span>`;
                
                const btnText = isFree ? "Descargar Gratis" : "Comprar con PayPal";
                const btnColor = isFree ? "bg-green-600 hover:bg-green-700" : "bg-blue-600 hover:bg-blue-700";
                const icon = isFree ? "fa-download" : "fa-paypal";

                const cardHTML = `
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden card-hover flex flex-col">
                        <!-- Cover Art Simulado -->
                        <div class="h-40 ${product.coverColor} flex items-center justify-center relative group">
                            <i class="fa-solid ${product.icon} text-white text-5xl opacity-80 group-hover:scale-110 transition duration-300"></i>
                            <div class="absolute bottom-2 right-2 bg-black bg-opacity-50 text-white text-xs px-2 py-1 rounded">
                                ${product.type}
                            </div>
                        </div>
                        
                        <!-- Body -->
                        <div class="p-6 flex-grow">
                            <h3 class="font-bold text-lg text-gray-900 leading-tight mb-1">${product.title}</h3>
                            <p class="text-sm text-gray-500 mb-4">${product.artist}</p>
                            
                            <!-- Reproductor Simple de HTML5 -->
                            <audio controls class="w-full mb-4 h-8">
                                <source src="${product.url}" type="audio/mpeg">
                                Tu navegador no soporta el elemento de audio.
                            </audio>

                            <div class="flex items-center justify-between mt-auto pt-4 border-t border-gray-100">
                                <div>${priceDisplay}</div>
                            </div>
                        </div>

                        <!-- Footer / Button -->
                        <div class="px-6 pb-6">
                            <button onclick="handlePurchase(${product.id})" class="w-full ${btnColor} text-white font-bold py-3 px-4 rounded-xl transition duration-200 flex items-center justify-center shadow-lg shadow-blue-500/30">
                                <i class="fa-brands ${icon} mr-2"></i> ${btnText}
                            </button>
                            ${!isFree ? `<p class="text-xs text-center text-gray-400 mt-2"><i class="fa-solid fa-lock"></i> Pago procesado por PayPal</p>` : ''}
                        </div>
                    </div>
                `;
                grid.innerHTML += cardHTML;
            });
        }

        // Simular Proceso de Compra/Descarga
        function handlePurchase(productId) {
            const product = products.find(p => p.id === productId);
            if(!product) return;

            // Mostrar modal de procesamiento
            const processingModal = document.getElementById('processing-modal');
            processingModal.classList.remove('hidden');

            // Simular tiempo de red (1.5 segundos)
            setTimeout(() => {
                processingModal.classList.add('hidden');
                
                // Mostrar éxito
                const successModal = document.getElementById('success-modal');
                successModal.classList.remove('hidden');

                // Iniciar Descarga
                triggerDownload(product.url, product.title);

            }, 1500);
        }

        function triggerDownload(url, filename) {
            // Nota: Debido a políticas de seguridad del navegador (CORS) con archivos externos,
            // a veces 'download' atributo es ignorado y el navegador reproduce el archivo.
            // Para asegurar la descarga en un entorno real, el servidor debe enviar headers específicos.
            
            // Método 1: Crear un elemento temporal
            const link = document.createElement('a');
            link.href = url;
            // Intentar forzar nombre de archivo
            link.setAttribute('download', filename + '.mp3'); 
            link.setAttribute('target', '_blank'); // Abrir en nueva pestaña si la descarga directa falla
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        }

        // Inicializar
        document.addEventListener('DOMContentLoaded', renderProducts);

    </script>
</body>
</html>
