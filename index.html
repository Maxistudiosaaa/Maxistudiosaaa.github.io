<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechShop - Pago con PayPal</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Animaciones suaves para el carrito */
        .cart-overlay {
            background-color: rgba(0, 0, 0, 0.5);
            transition: opacity 0.3s ease;
        }
        .cart-sidebar {
            transition: transform 0.3s ease-in-out;
        }
        /* Ocultar scrollbar en el carrito pero mantener funcionalidad */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Loader simple */
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-800">

    <!-- Navegación -->
    <nav class="bg-white shadow-md sticky top-0 z-40">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-microchip text-blue-600 text-2xl"></i>
                <span class="text-xl font-bold tracking-tight">TechShop</span>
            </div>
            <button onclick="toggleCart()" class="relative p-2 hover:bg-gray-100 rounded-full transition">
                <i class="fa-solid fa-cart-shopping text-xl text-gray-700"></i>
                <span id="cart-count" class="absolute top-0 right-0 bg-red-500 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center transform scale-0 transition-transform duration-200">0</span>
            </button>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="bg-blue-600 text-white py-12 mb-8">
        <div class="container mx-auto px-4 text-center">
            <h1 class="text-4xl font-bold mb-2">Lo último en tecnología</h1>
            <p class="text-blue-100">Envío gratis en compras mayores a $100</p>
        </div>
    </header>

    <!-- Lista de Productos -->
    <main class="container mx-auto px-4 mb-20">
        <h2 class="text-2xl font-bold mb-6 border-l-4 border-blue-600 pl-3">Nuestros Productos</h2>
        
        <!-- Grid de productos -->
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Los productos se renderizan aquí vía JS -->
        </div>
    </main>

    <!-- Modal del Carrito -->
    <div id="cart-modal" class="fixed inset-0 z-50 pointer-events-none opacity-0 transition-opacity duration-300">
        <!-- Overlay oscuro -->
        <div onclick="toggleCart()" class="cart-overlay absolute inset-0 bg-black bg-opacity-50"></div>
        
        <!-- Sidebar del carrito -->
        <div id="cart-sidebar" class="absolute right-0 top-0 h-full w-full max-w-md bg-white shadow-xl transform translate-x-full transition-transform duration-300 pointer-events-auto flex flex-col">
            
            <!-- Cabecera del carrito -->
            <div class="p-5 border-b flex justify-between items-center bg-gray-50">
                <h2 class="text-xl font-bold"><i class="fa-solid fa-bag-shopping mr-2"></i> Tu Carrito</h2>
                <button onclick="toggleCart()" class="text-gray-500 hover:text-red-500 transition">
                    <i class="fa-solid fa-xmark text-2xl"></i>
                </button>
            </div>

            <!-- Items del carrito -->
            <div id="cart-items" class="flex-1 overflow-y-auto p-5 space-y-4 no-scrollbar">
                <!-- Items inyectados vía JS -->
                <div class="text-center text-gray-400 mt-10">
                    <i class="fa-solid fa-cart-arrow-down text-4xl mb-2"></i>
                    <p>Tu carrito está vacío</p>
                </div>
            </div>

            <!-- Footer del carrito (Total + PayPal) -->
            <div class="border-t p-6 bg-gray-50">
                <div class="flex justify-between items-center mb-4 text-lg font-bold">
                    <span>Total:</span>
                    <span id="cart-total" class="text-blue-600">$0.00</span>
                </div>

                <!-- Contenedor del botón de PayPal -->
                <div id="paypal-button-container" class="w-full min-h-[150px]">
                    <!-- Aquí se inyecta el botón o el fallback -->
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-gray-800 text-gray-300 py-8 text-center mt-auto">
        <p>&copy; 2023 TechShop. Ejemplo de integración PayPal.</p>
    </footer>

    <!-- Lógica de la Aplicación -->
    <script>
        // --- CONFIGURACIÓN ---
        const PAYPAL_CLIENT_ID = "BAAbxWELSelhsN-zCv0wLVYY_A-_4O0ocsPTG8XbnZ0HVnBZPMkudlSDa9ClU03AB2pId-gWM3o2GS4kcc";
        
        // --- Interceptor de Errores Globales (FIX CRÍTICO) ---
        // Esto captura los errores del SDK cuando el iframe bloquea el acceso a window.top
        window.addEventListener('error', function(event) {
            const errorMsg = (event.message || "").toLowerCase();
            // Detectar errores específicos de PayPal o restricciones de iframe
            if (errorMsg.includes('paypal') || errorMsg.includes('window host') || errorMsg.includes('postmessage')) {
                // Si ya estamos usando fallback, ignorar
                if (window.useFallback) return;

                console.warn("⚠️ Detectado entorno restringido o error de PayPal. Activando modo simulación seguro.");
                renderFallbackButton();
            }
        }, true); // Use capture phase

        // --- 1. Datos de Productos ---
        const products = [
            {
                id: 1,
                name: "Auriculares Noise Cancelling",
                price: 59.99,
                description: "Sonido de alta fidelidad con cancelación de ruido.",
                image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500&auto=format&fit=crop&q=60"
            },
            {
                id: 2,
                name: "Smartwatch Deportivo",
                price: 129.50,
                description: "Monitoreo de salud y notificaciones en tu muñeca.",
                image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&auto=format&fit=crop&q=60"
            },
            {
                id: 3,
                name: "Cámara Instantánea",
                price: 89.00,
                description: "Captura momentos y obtén la foto al instante.",
                image: "https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=500&auto=format&fit=crop&q=60"
            },
            {
                id: 4,
                name: "Gafas de Sol Polarizadas",
                price: 45.00,
                description: "Estilo clásico con protección UV total.",
                image: "https://images.unsplash.com/photo-1572635196237-14b3f281503f?w=500&auto=format&fit=crop&q=60"
            },
            {
                id: 5,
                name: "Teclado Mecánico RGB",
                price: 75.99,
                description: "Switches azules para la mejor experiencia de tipeo.",
                image: "https://images.unsplash.com/photo-1587829741301-dc798b91a603?w=500&auto=format&fit=crop&q=60"
            },
            {
                id: 6,
                name: "Mochila Tech Impermeable",
                price: 34.99,
                description: "Protege tu laptop y gadgets de la lluvia.",
                image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=500&auto=format&fit=crop&q=60"
            }
        ];

        // --- 2. Estado del Carrito ---
        let cart = [];
        let isCartOpen = false;
        let isPayPalReady = false;
        window.useFallback = false; // Hacer global para el listener

        // --- 3. Renderizado de Productos ---
        const productsGrid = document.getElementById('products-grid');

        function renderProducts() {
            productsGrid.innerHTML = products.map(product => `
                <div class="bg-white rounded-xl shadow-sm hover:shadow-lg transition overflow-hidden border border-gray-100 flex flex-col h-full">
                    <div class="h-48 overflow-hidden relative group">
                        <img src="${product.image}" alt="${product.name}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
                    </div>
                    <div class="p-5 flex-1 flex flex-col">
                        <h3 class="font-bold text-lg mb-1">${product.name}</h3>
                        <p class="text-sm text-gray-500 mb-4 flex-1">${product.description}</p>
                        <div class="flex justify-between items-center mt-auto">
                            <span class="text-xl font-bold text-gray-900">$${product.price.toFixed(2)}</span>
                            <button onclick="addToCart(${product.id})" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition active:scale-95">
                                Agregar <i class="fa-solid fa-plus ml-1"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // --- 4. Lógica del Carrito ---
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existingItem = cart.find(item => item.id === productId);

            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }

            updateCartUI();
            
            // Feedback visual simple
            const btn = event.target.closest('button');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-check"></i>';
            btn.classList.replace('bg-blue-600', 'bg-green-600');
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.classList.replace('bg-green-600', 'bg-blue-600');
            }, 1000);
        }

        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            updateCartUI();
        }

        function updateQuantity(productId, change) {
            const item = cart.find(item => item.id === productId);
            if (item) {
                item.quantity += change;
                if (item.quantity <= 0) {
                    removeFromCart(productId);
                } else {
                    updateCartUI();
                }
            }
        }

        function getCartTotal() {
            return cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
        }

        function updateCartUI() {
            const cartItemsContainer = document.getElementById('cart-items');
            const cartCountBadge = document.getElementById('cart-count');
            const cartTotalElement = document.getElementById('cart-total');
            const paypalContainer = document.getElementById('paypal-button-container');

            // Actualizar badge
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            cartCountBadge.textContent = totalItems;
            cartCountBadge.classList.toggle('scale-100', totalItems > 0);
            cartCountBadge.classList.toggle('scale-0', totalItems === 0);

            // Actualizar total
            cartTotalElement.textContent = `$${getCartTotal().toFixed(2)}`;

            // Actualizar lista
            if (cart.length === 0) {
                cartItemsContainer.innerHTML = `
                    <div class="text-center text-gray-400 mt-10">
                        <i class="fa-solid fa-cart-arrow-down text-4xl mb-2"></i>
                        <p>Tu carrito está vacío</p>
                    </div>`;
                paypalContainer.style.display = 'none';
            } else {
                paypalContainer.style.display = 'block';
                
                // Si usamos fallback y no se ha renderizado aún
                if (window.useFallback && !paypalContainer.innerHTML.includes('Simulación')) {
                    renderFallbackButton();
                }

                cartItemsContainer.innerHTML = cart.map(item => `
                    <div class="flex items-center gap-4 bg-white p-3 rounded-lg border border-gray-100 shadow-sm">
                        <img src="${item.image}" alt="${item.name}" class="w-16 h-16 object-cover rounded-md">
                        <div class="flex-1">
                            <h4 class="font-medium text-sm line-clamp-1">${item.name}</h4>
                            <p class="text-blue-600 font-bold">$${(item.price * item.quantity).toFixed(2)}</p>
                        </div>
                        <div class="flex flex-col items-end gap-2">
                            <div class="flex items-center gap-2 bg-gray-100 rounded-lg p-1">
                                <button onclick="updateQuantity(${item.id}, -1)" class="w-6 h-6 flex items-center justify-center bg-white rounded shadow-sm text-xs hover:text-red-500 transition">-</button>
                                <span class="text-xs font-bold w-4 text-center">${item.quantity}</span>
                                <button onclick="updateQuantity(${item.id}, 1)" class="w-6 h-6 flex items-center justify-center bg-white rounded shadow-sm text-xs hover:text-blue-500 transition">+</button>
                            </div>
                            <button onclick="removeFromCart(${item.id})" class="text-xs text-gray-400 hover:text-red-500 underline">Eliminar</button>
                        </div>
                    </div>
                `).join('');
            }
        }

        // --- 5. Control del Modal ---
        function toggleCart() {
            const modal = document.getElementById('cart-modal');
            const sidebar = document.getElementById('cart-sidebar');
            
            isCartOpen = !isCartOpen;

            if (isCartOpen) {
                modal.classList.remove('pointer-events-none', 'opacity-0');
                sidebar.classList.remove('translate-x-full');
            } else {
                modal.classList.add('pointer-events-none', 'opacity-0');
                sidebar.classList.add('translate-x-full');
            }
        }

        // --- 6. Integración de PayPal Robusta (Fallback Automático) ---
        function renderFallbackButton() {
            window.useFallback = true;
            const container = document.getElementById('paypal-button-container');
            if (!container) return;
            
            container.innerHTML = `
                <div class="bg-yellow-50 border border-yellow-200 p-3 rounded-lg mb-3 text-xs text-yellow-800">
                    <i class="fa-solid fa-triangle-exclamation mr-1"></i>
                    Modo Simulación (Entorno Restringido)
                </div>
                <button onclick="simulatePayment()" class="w-full bg-[#0070ba] hover:bg-[#003087] text-white font-bold py-3 px-4 rounded-full shadow-md transition flex items-center justify-center gap-2">
                    <i class="fa-brands fa-paypal text-xl"></i> Pagar con PayPal (Simulado)
                </button>
                <div class="text-center mt-2">
                    <span class="text-xs text-gray-400"><i class="fa-solid fa-lock"></i> Pago seguro</span>
                </div>
            `;
        }

        function simulatePayment() {
            const total = getCartTotal().toFixed(2);
            // Simular proceso de red
            const btn = document.querySelector('#paypal-button-container button');
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<div class="loader"></div> Procesando...';
            btn.disabled = true;

            setTimeout(() => {
                alert(`¡Pago Simulado Exitoso!\nTotal cobrado: $${total}\n\nEn un entorno real, esto habría procesado el pago vía PayPal.`);
                cart = [];
                updateCartUI();
                toggleCart();
                btn.innerHTML = originalContent;
                btn.disabled = false;
            }, 1500);
        }

        function loadPayPalSDK() {
            if (window.useFallback) return;

            const container = document.getElementById('paypal-button-container');
            container.innerHTML = '<div class="flex justify-center py-4"><div class="loader"></div></div>';

            const script = document.createElement('script');
            // Nota: Se agrega disable-funding para simplificar y evitar llamadas extra que suelen fallar en iframes
            script.src = `https://www.paypal.com/sdk/js?client-id=${PAYPAL_CLIENT_ID}&currency=USD&disable-funding=credit,card`;
            script.setAttribute('data-namespace', 'paypal_sdk');
            
            script.onload = function() {
                try {
                    if (window.paypal_sdk && !window.useFallback) {
                        window.paypal_sdk.Buttons({
                            createOrder: function(data, actions) {
                                return actions.order.create({
                                    purchase_units: [{
                                        description: "Compra en TechShop",
                                        amount: { value: getCartTotal().toFixed(2) }
                                    }]
                                });
                            },
                            onApprove: function(data, actions) {
                                return actions.order.capture().then(function(details) {
                                    alert('¡Pago Completado por ' + details.payer.name.given_name + '!');
                                    cart = [];
                                    updateCartUI();
                                    toggleCart();
                                });
                            },
                            onError: function(err) {
                                console.warn('PayPal SDK Error Interno (onError catch):', err);
                                renderFallbackButton();
                            },
                            style: { layout: 'vertical', color: 'blue', shape: 'rect', label: 'paypal' }
                        }).render('#paypal-button-container');
                        isPayPalReady = true;
                    } else {
                         // Si el objeto no existe tras carga
                         renderFallbackButton();
                    }
                } catch (e) {
                    console.warn("Fallo al inicializar botones PayPal:", e);
                    renderFallbackButton();
                }
            };

            script.onerror = function() {
                console.warn("Error de red cargando script PayPal.");
                renderFallbackButton();
            };

            document.body.appendChild(script);
        }

        // Inicializar
        renderProducts();
        updateCartUI();
        
        // Cargar PayPal
        setTimeout(loadPayPalSDK, 1000);

    </script>
</body>
</html>
